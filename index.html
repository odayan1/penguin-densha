<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ぺんぎんでんしゃ">
<meta name="theme-color" content="#bfe8ff">
<link rel="apple-touch-icon" href="icon.png">
<title>ペンギンのでんしゃ おでかけ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family: "Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Rounded Mplus 1c", sans-serif; }
  body {
    display:flex; flex-direction:column; height:100dvh;
    background: linear-gradient(#bfe8ff 0%, #d9f3ff 55%, #eafbe8 55%, #eafbe8 100%);
    color:#2b3a4a; overscroll-behavior:none;
  }
  /* ===== top bar ===== */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; gap:8px; }
  .steps { display:flex; gap:8px; }
  .dot {
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#fff; background:#c7d3de; transition:all .3s;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08);
  }
  .dot.active { background:#ff9d2e; transform:scale(1.12); box-shadow:0 4px 10px rgba(255,157,46,.5); }
  .dot.done { background:#4caf50; }
  .dot .check { font-size:22px; }
  .soundbtn {
    border:none; background:#ffffffcc; border-radius:999px; padding:10px 14px; font-size:18px; font-weight:800; color:#2b3a4a;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  /* ===== narration banner ===== */
  .banner {
    margin:2px 12px 0; padding:10px 14px; background:#ffffffdd; border-radius:16px; text-align:center;
    font-size:min(5.6vw,24px); font-weight:800; color:#36506a; min-height:1.6em; line-height:1.35;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  /* ===== stage & scrolling world ===== */
  .stage { position:relative; flex:1; overflow:hidden; }
  .layer { position:absolute; inset:0; pointer-events:none; will-change:transform; }
  #layerFar  { z-index:1; }
  #layerMid  { z-index:2; }
  #layerNearBack { z-index:3; }   /* station, signs — behind the train */
  #layerNearFront { z-index:6; }  /* crossing — in front of the train */
  .scn { position:absolute; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.1)); }
  .cloud { position:absolute; font-size:40px; opacity:.85; animation: drift 40s linear infinite; }
  @keyframes drift { from{ transform:translateX(0) } to{ transform:translateX(-30vw) } }

  /* track (fixed) + ties (scrolled via background-position) */
  .track {
    position:absolute; left:0; right:0; bottom:24%; height:14px; background:#7a6a58; z-index:4;
    border-top:4px solid #9c8a74; border-bottom:4px solid #5c4e40;
  }
  .ties { position:absolute; left:0; right:0; bottom:24%; height:14px; z-index:4;
    background-image: repeating-linear-gradient(90deg,#5c4e40 0 8px, transparent 8px 34px);
  }

  /* ===== train (stays in place, world moves) ===== */
  #trainWrap {
    position:absolute; bottom:calc(24% + 8px); left:6%;
    width:min(62vw,420px); z-index:5; will-change:transform;
  }
  #trainWrap.bob svg { animation: bob .5s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  #trainWrap svg { width:100%; height:auto; display:block; filter:drop-shadow(0 4px 3px rgba(0,0,0,.18)); }
  /* wheels spin while traveling */
  .wheel { transform-box:fill-box; transform-origin:center; }
  #trainWrap.traveling .wheel { animation: spin .55s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* rider sways happily while riding */
  #trainWrap.traveling .rider { animation: ridersway 1s ease-in-out infinite; }
  @keyframes ridersway { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} }
  /* smoke puffs */
  .puff {
    position:absolute; font-size:26px; pointer-events:none; z-index:5; opacity:0;
    animation: puff 1.4s ease-out forwards;
  }
  @keyframes puff {
    0% { opacity:0; transform:translate(0,0) scale(.5); }
    20%{ opacity:.9; }
    100%{ opacity:0; transform:translate(-90px,-70px) scale(1.4); }
  }
  .rider {
    position:absolute; top:-34px; left:16%; font-size:min(11vw,48px); display:none; line-height:1;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));
  }
  #trainWrap.hasRider .rider { display:block; }

  /* ===== penguin (step 1) ===== */
  #penguin {
    position:absolute; bottom:calc(24% + 6px); left:3%; font-size:min(17vw,82px);
    transition: left .7s ease, bottom .7s ease, transform .3s;
    z-index:7; cursor:pointer; padding:10px; line-height:1;
  }
  #penguin.onboard { left:10%; bottom:calc(24% + 56px); }
  .pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }
  #penguin.hop { animation: hop 1.4s ease-in-out 2; }
  @keyframes hop { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-30px)} 50%{transform:translateY(0)} 75%{transform:translateY(-18px)} }
  /* milestone confetti */
  .confetti { position:absolute; top:-40px; font-size:26px; pointer-events:none; z-index:10; animation: fall 2.4s ease-in forwards; }
  @keyframes fall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(300deg); opacity:.9; }
  }
  .tapring {
    position:absolute; border:5px dashed #ff5e5e; border-radius:50%;
    width:130px; height:130px; left:2%; bottom:calc(24% - 2px); z-index:6; pointer-events:none;
    animation: ring 1.1s ease-out infinite; opacity:0;
  }
  @keyframes ring { 0%{transform:scale(.7);opacity:.9} 100%{transform:scale(1.25);opacity:0} }

  /* ===== crossing (踏切) ===== */
  .crossing { position:absolute; bottom:calc(24% + 10px); width:70px; }
  .cx-pole {
    width:12px; height:120px; margin-left:28px; border-radius:5px;
    background:repeating-linear-gradient(45deg,#ffd400 0 10px,#333 10px 20px);
  }
  .cx-buck { position:absolute; top:-30px; left:10px; font-size:30px; color:#ffd400; font-weight:900; text-shadow:0 2px 2px rgba(0,0,0,.5); }
  .cx-lights {
    position:absolute; top:2px; left:4px; display:flex; gap:8px; background:#333; border-radius:14px; padding:5px 8px;
  }
  .lt { width:15px; height:15px; border-radius:50%; background:#5a2020; }
  .crossing.active .lt.l1 { animation: blinkA .9s steps(1) infinite; }
  .crossing.active .lt.l2 { animation: blinkB .9s steps(1) infinite; }
  @keyframes blinkA { 0%,49%{background:#ff3b3b; box-shadow:0 0 12px #ff8a8a} 50%,100%{background:#5a2020; box-shadow:none} }
  @keyframes blinkB { 0%,49%{background:#5a2020; box-shadow:none} 50%,100%{background:#ff3b3b; box-shadow:0 0 12px #ff8a8a} }
  .gate {
    position:absolute; bottom:16px; left:36px; width:130px; height:11px; border-radius:6px;
    background:repeating-linear-gradient(90deg,#ffd400 0 16px,#e23b3b 16px 32px);
    transform-origin:left center; transform:rotate(0deg); transition:transform 1.4s ease;
    box-shadow:0 2px 3px rgba(0,0,0,.2);
  }
  .crossing.open .gate { transform:rotate(-80deg); }

  /* ===== station ===== */
  .station { position:absolute; bottom:calc(24% + 8px); text-align:center; }
  .station .bld { font-size:min(16vw,76px); line-height:1; }
  .station .sign {
    background:#fff; border:3px solid #4a90d9; border-radius:10px; padding:3px 8px;
    font-size:14px; font-weight:900; color:#2b5a8a; margin-bottom:4px; white-space:nowrap;
    box-shadow:0 2px 4px rgba(0,0,0,.12);
  }

  /* ===== big action buttons ===== */
  .actionWrap { position:absolute; left:0; right:0; bottom:3%; display:flex; justify-content:center; z-index:8; }
  .bigbtn {
    border:none; border-radius:26px; padding:20px 34px; font-size:min(8vw,34px); font-weight:900; color:#fff;
    box-shadow:0 7px 0 rgba(0,0,0,.18), 0 10px 20px rgba(0,0,0,.2); display:none; align-items:center; gap:10px;
    min-height:64px; min-width:200px; justify-content:center;
  }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .bigbtn.show { display:inline-flex; animation: pulse 1.1s ease-in-out infinite; }
  #departBtn { background:linear-gradient(#ff8a3d,#ff6a00); }
  #againBtn  { background:linear-gradient(#4db6ff,#1f8fff); }

  /* sparkles */
  .spark { position:absolute; font-size:30px; pointer-events:none; animation: floatUp 1.6s ease-out forwards; z-index:9; }
  @keyframes floatUp { 0%{opacity:0; transform:translateY(0) scale(.5)} 20%{opacity:1} 100%{opacity:0; transform:translateY(-120px) scale(1.2)} }

  /* ===== yard (collection) ===== */
  .yard {
    display:flex; align-items:center; gap:6px; background:#ffffffee;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)) 12px;
    border-top:3px solid #ffd27a; overflow-x:auto; min-height:64px;
  }
  .resetbtn.armed { background:#ffd9d9; color:#c0392b; font-weight:800; }
  .yard .label { font-weight:900; color:#e08600; font-size:16px; white-space:nowrap; }
  .yardtrain { font-size:34px; flex:0 0 auto; animation: hopIn .5s ease; }
  .yardtrain.new { animation: hopNew .8s ease; }
  @keyframes hopIn { from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes hopNew { 0%{transform:scale(0) rotate(-10deg)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .resetbtn { margin-left:auto; border:none; background:#eef1f4; color:#90a0ad; border-radius:10px; padding:8px 12px; font-size:12px; flex:0 0 auto; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="steps">
      <div class="dot" id="dot1">1</div>
      <div class="dot" id="dot2">2</div>
      <div class="dot" id="dot3">3</div>
    </div>
    <button class="soundbtn" id="soundBtn">🔊 おと</button>
  </div>

  <div class="banner" id="banner">ペンギンさんを タッチしてね</div>

  <div class="stage" id="stage">
    <div class="cloud" style="left:18%; top:8%;">☁️</div>
    <div class="cloud" style="right:10%; top:16%; font-size:30px; animation-duration:55s;">☁️</div>

    <div class="layer" id="layerFar"></div>
    <div class="layer" id="layerMid"></div>
    <div class="layer" id="layerNearBack"></div>

    <div class="track"></div>
    <div class="ties" id="ties"></div>

    <div class="tapring" id="tapring"></div>
    <div id="trainWrap"></div>
    <div id="penguin">🐧</div>

    <div class="layer" id="layerNearFront"></div>

    <div class="actionWrap">
      <button class="bigbtn" id="departBtn">🚂 しゅっぱつ</button>
      <button class="bigbtn" id="againBtn">🔁 もういちど</button>
    </div>
  </div>

  <div class="yard" id="yard">
    <span class="label" id="yardLabel">でんしゃ 0だい</span>
    <button class="resetbtn" id="resetBtn">さいしょから</button>
  </div>

<script>
/* ============ SVG trains ============ */
function azusaSVG(){ return `
<svg viewBox="0 0 420 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="30" width="412" height="56" rx="26" fill="#ffffff" stroke="#c9d2db" stroke-width="2"/>
  <path d="M4 56 Q4 30 40 30 L40 86 Q4 86 4 56Z" fill="#f2f5f8"/>
  <rect x="4" y="52" width="412" height="12" fill="#7d4fd1"/>
  <rect x="4" y="66" width="412" height="4" fill="#59c36a"/>
  <rect x="60" y="38" width="46" height="26" rx="6" fill="#bfe6ff" stroke="#8fb8d6"/>
  <rect x="118" y="38" width="46" height="26" rx="6" fill="#bfe6ff" stroke="#8fb8d6"/>
  <rect x="176" y="38" width="46" height="26" rx="6" fill="#bfe6ff" stroke="#8fb8d6"/>
  <rect x="234" y="38" width="46" height="26" rx="6" fill="#bfe6ff" stroke="#8fb8d6"/>
  <rect x="292" y="38" width="46" height="26" rx="6" fill="#bfe6ff" stroke="#8fb8d6"/>
  <g class="wheel"><circle cx="90" cy="92" r="13" fill="#3a3a3a"/><circle cx="90" cy="92" r="5" fill="#aaa"/><line x1="90" y1="80" x2="90" y2="104" stroke="#888" stroke-width="2"/></g>
  <g class="wheel"><circle cx="320" cy="92" r="13" fill="#3a3a3a"/><circle cx="320" cy="92" r="5" fill="#aaa"/><line x1="320" y1="80" x2="320" y2="104" stroke="#888" stroke-width="2"/></g>
</svg>`; }

function freightSVG(){ return `
<svg viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="34" width="120" height="58" rx="8" fill="#e23b3b" stroke="#b02a2a" stroke-width="2"/>
  <rect x="14" y="44" width="40" height="24" rx="4" fill="#ffe08a" stroke="#caa94a"/>
  <rect x="2" y="78" width="120" height="8" fill="#7a1f1f"/>
  <g class="wheel"><circle cx="34" cy="98" r="11" fill="#333"/><line x1="34" y1="88" x2="34" y2="108" stroke="#888" stroke-width="2"/></g>
  <g class="wheel"><circle cx="90" cy="98" r="11" fill="#333"/><line x1="90" y1="88" x2="90" y2="108" stroke="#888" stroke-width="2"/></g>
  <rect x="128" y="80" width="140" height="8" fill="#555"/>
  <rect x="136" y="44" width="124" height="38" rx="4" fill="#2f8f4e" stroke="#1f6c39"/>
  <line x1="178" y1="44" x2="178" y2="82" stroke="#1f6c39"/><line x1="220" y1="44" x2="220" y2="82" stroke="#1f6c39"/>
  <g class="wheel"><circle cx="160" cy="98" r="11" fill="#333"/><line x1="160" y1="88" x2="160" y2="108" stroke="#888" stroke-width="2"/></g>
  <g class="wheel"><circle cx="236" cy="98" r="11" fill="#333"/><line x1="236" y1="88" x2="236" y2="108" stroke="#888" stroke-width="2"/></g>
  <rect x="274" y="80" width="142" height="8" fill="#555"/>
  <rect x="282" y="44" width="126" height="38" rx="4" fill="#2b6fd0" stroke="#1d4f98"/>
  <line x1="324" y1="44" x2="324" y2="82" stroke="#1d4f98"/><line x1="366" y1="44" x2="366" y2="82" stroke="#1d4f98"/>
  <g class="wheel"><circle cx="306" cy="98" r="11" fill="#333"/><line x1="306" y1="88" x2="306" y2="108" stroke="#888" stroke-width="2"/></g>
  <g class="wheel"><circle cx="382" cy="98" r="11" fill="#333"/><line x1="382" y1="88" x2="382" y2="108" stroke="#888" stroke-width="2"/></g>
</svg>`; }

const TRAINS = [
  { key:'azusa',   name:'あずさ', emoji:'🚆', svg:azusaSVG },
  { key:'freight', name:'かもつ', emoji:'🚃', svg:freightSVG },
];

/* ============ state ============ */
let soundOn = true;
let step = 1;
let phase = 'board';   // board | ready | travel | arrived
let roundIdx = 0;
let yardTrains = [];
let current = null;

const stage = document.getElementById('stage');
const banner = document.getElementById('banner');
const trainWrap = document.getElementById('trainWrap');
const penguin = document.getElementById('penguin');
const tapring = document.getElementById('tapring');
const departBtn = document.getElementById('departBtn');
const againBtn = document.getElementById('againBtn');
const dots = [null, document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];
const yardLabel = document.getElementById('yardLabel');
const yard = document.getElementById('yard');
const soundBtn = document.getElementById('soundBtn');
const layerFar = document.getElementById('layerFar');
const layerMid = document.getElementById('layerMid');
const layerNearBack = document.getElementById('layerNearBack');
const layerNearFront = document.getElementById('layerNearFront');
const ties = document.getElementById('ties');

/* ============ audio ============ */
let actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); }
function tone(freq, dur, type='sine', vol=0.18, when=0){
  if(!soundOn || !actx) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function chimeGood(){ tone(660,0.15,'sine',0.2,0); tone(880,0.25,'sine',0.2,0.12); }
function chimeTap(){ tone(520,0.12,'triangle',0.18); }
function tootDepart(){ tone(330,0.5,'sawtooth',0.12); tone(392,0.5,'sawtooth',0.1,0.1); }
function fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.3,'sine',0.2,i*0.14)); }

function speak(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; u.rate=0.9; u.pitch=1.2; u.volume=1;
    const v = (window.speechSynthesis.getVoices()||[]).find(x=>/ja|Japan/i.test(x.lang));
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ helpers ============ */
function setStep(n){
  step = n;
  for(let i=1;i<=3;i++){
    dots[i].classList.remove('active','done'); dots[i].textContent = i;
    if(i<n){ dots[i].classList.add('done'); dots[i].innerHTML='<span class="check">✓</span>'; }
    else if(i===n){ dots[i].classList.add('active'); }
  }
}
function sparkleAt(x,y){
  const emos=['✨','⭐','🎉','💫'];
  for(let i=0;i<6;i++){
    const s=document.createElement('div'); s.className='spark'; s.textContent=emos[i%emos.length];
    s.style.left=(x+(Math.random()*120-60))+'px'; s.style.top=(y+(Math.random()*40-20))+'px';
    stage.appendChild(s);
    setTimeout(()=>s.remove(),1700);
  }
}

/* ============ world / scenery ============ */
let stageW = 0, totalScroll = 0, crossingX = 0;
let crossingEl = null;

function addScn(layer, emo, x, bottom, size){
  const s=document.createElement('div'); s.className='scn'; s.textContent=emo;
  s.style.left=x+'px'; s.style.bottom=bottom; s.style.fontSize=size+'px';
  layer.appendChild(s);
}

function buildScenery(){
  layerFar.innerHTML=''; layerMid.innerHTML=''; layerNearBack.innerHTML=''; layerNearFront.innerHTML='';
  stageW = stage.clientWidth || window.innerWidth;
  totalScroll = stageW * 2.2;
  const worldW = totalScroll + stageW;

  /* far: mountains + Mt. Fuji (scroll x0.25 → place over wider span) */
  for(let x=stageW*0.15; x < worldW*0.8; x += stageW*(0.45+Math.random()*0.35)){
    addScn(layerFar, '⛰️', x, 'calc(24% + 34px)', 42+Math.random()*22);
  }
  addScn(layerFar, '🗻', worldW*0.35, 'calc(24% + 34px)', 72);
  /* mid: trees, houses & birds (scroll x0.55) */
  const midEmo=['🌳','🌲','🏠','🌻','🌳','🏡'];
  for(let x=stageW*0.35; x < worldW*1.3; x += stageW*(0.22+Math.random()*0.28)){
    addScn(layerMid, midEmo[(Math.random()*midEmo.length)|0], x, 'calc(24% + 16px)', 28+Math.random()*18);
  }
  addScn(layerMid, '🐦', worldW*0.5, '62%', 24);
  addScn(layerMid, '🐦', worldW*0.9, '70%', 20);
  /* near back: station (with sign) at the end of the line */
  const st=document.createElement('div'); st.className='station';
  st.style.left=(totalScroll + stageW*0.58)+'px';
  st.innerHTML='<div class="sign">おでかけえき</div><div class="bld">🚉</div>';
  layerNearBack.appendChild(st);

  /* near front: crossing */
  crossingX = stageW * 1.5;
  crossingEl = document.createElement('div');
  crossingEl.className='crossing';
  crossingEl.style.left=crossingX+'px';
  crossingEl.innerHTML = `
    <div class="cx-buck">✕</div>
    <div class="cx-lights"><span class="lt l1"></span><span class="lt l2"></span></div>
    <div class="cx-pole"></div>
    <div class="gate"></div>`;
  crossingEl.classList.add('open');   /* gate starts up; closes when the train approaches */
  layerNearFront.appendChild(crossingEl);

  setScroll(0);
}

function setScroll(d){
  layerNearFront.style.transform = 'translateX('+(-d)+'px)';
  layerNearBack.style.transform  = 'translateX('+(-d)+'px)';
  layerMid.style.transform       = 'translateX('+(-d*0.55)+'px)';
  layerFar.style.transform       = 'translateX('+(-d*0.25)+'px)';
  ties.style.backgroundPosition  = (-d)+'px 0';
}

/* ============ crossing sound ============ */
let kanTimer=null, kanFlip=false, kanOn=false, crossingDone=false;
function startKankan(){
  if(kanOn) return; kanOn=true;
  crossingEl.classList.add('active');
  crossingEl.classList.remove('open');   /* gate comes down */
  banner.textContent = 'カンカンカン ふみきり！ 🚦';
  speak('カンカンカン。ふみきりだよ');
  kanTimer=setInterval(()=>{ kanFlip=!kanFlip; tone(kanFlip?820:660,0.14,'square',0.07); },450);
}
function stopKankan(){
  if(!kanOn) return; kanOn=false;
  clearInterval(kanTimer); kanTimer=null;
  crossingEl.classList.remove('active');
  crossingEl.classList.add('open');      /* gate goes back up */
  banner.textContent = 'でんしゃが はしっているよ 🚃💨';
}

/* ============ journey ============ */
const DURATION = 11000;
function easeInOutCubic(p){ return p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }

let smokeTimer=null, clackTimer=null;
function startTravelFx(){
  trainWrap.classList.add('traveling');
  /* smoke puffs from the front of the train */
  smokeTimer=setInterval(()=>{
    const tr = trainWrap.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const p=document.createElement('div'); p.className='puff'; p.textContent='💨';
    p.style.left=(tr.right-sr.left-20)+'px';
    p.style.top =(tr.top-sr.top-6)+'px';
    stage.appendChild(p);
    setTimeout(()=>p.remove(),1500);
  },620);
  /* soft clack-clack rhythm */
  clackTimer=setInterval(()=>{ tone(170,0.05,'square',0.045); tone(150,0.05,'square',0.04,0.13); },700);
}
function stopTravelFx(){
  trainWrap.classList.remove('traveling');
  clearInterval(smokeTimer); smokeTimer=null;
  clearInterval(clackTimer); clackTimer=null;
}

function journey(){
  phase='travel';
  crossingDone=false;
  let t0=null;
  trainWrap.classList.add('bob');
  startTravelFx();
  function frame(now){
    if(t0===null) t0=now;
    const p=Math.min(1,(now-t0)/DURATION);
    const d=easeInOutCubic(p)*totalScroll;
    setScroll(d);
    if(!crossingDone && crossingEl){
      const cx = crossingX - d; /* crossing's screen x */
      if(cx < stageW*1.05) startKankan();
      if(cx < stageW*0.02){ stopKankan(); crossingDone=true; }
    }
    if(p<1){ requestAnimationFrame(frame); } else { arrive(); }
  }
  requestAnimationFrame(frame);
}

/* ============ game flow ============ */
function loadTrain(){
  const t = TRAINS[roundIdx % TRAINS.length];
  trainWrap.innerHTML = t.svg() + '<div class="rider">🐧</div>';
  return t;
}

function startRound(){
  /* safety: stop any leftover crossing sound/timers */
  if(kanTimer){ clearInterval(kanTimer); kanTimer=null; }
  kanOn=false;
  stopTravelFx();
  current = loadTrain();
  buildScenery();
  trainWrap.classList.remove('bob','hasRider','traveling');
  penguin.classList.remove('onboard','hop');
  penguin.style.transition=''; penguin.style.left='';   /* back to start position */
  penguin.style.display='block';
  penguin.classList.add('pulse');
  tapring.style.display='block';
  departBtn.classList.remove('show');
  againBtn.classList.remove('show');
  phase='board';
  setStep(1);
  banner.textContent = 'ペンギンさんを タッチしてね';
  speak('ペンギンさんを、でんしゃに のせてね');
}

/* STEP 1: tap penguin → boards and RIDES the train */
penguin.addEventListener('click', ()=>{
  ensureAudio();
  if(phase!=='board') return;
  phase='ready';
  buzz(30);
  penguin.classList.remove('pulse');
  tapring.style.display='none';
  penguin.classList.add('onboard');
  chimeTap(); chimeGood();
  setTimeout(()=>{
    penguin.style.display='none';
    trainWrap.classList.add('hasRider');   /* penguin now rides ON the train */
  }, 750);
  setStep(2);
  banner.textContent = 'じょうず！ 「しゅっぱつ」を おしてね';
  speak('じょうずだね。つぎは、しゅっぱつ ボタンを おしてね');
  setTimeout(()=>departBtn.classList.add('show'), 600);
});

/* STEP 2: depart → world scrolls, crossing passes */
departBtn.addEventListener('click', ()=>{
  ensureAudio();
  if(phase!=='ready') return;
  buzz(40);
  departBtn.classList.remove('show');
  setStep(3);
  banner.textContent = 'しゅっぱーつ！ 🚂💨';
  speak('しゅっぱーつ！');
  tootDepart();
  journey();
});

/* arrival */
function confettiRain(){
  const emos=['🎊','🎉','⭐','✨'];
  for(let i=0;i<16;i++){
    const c=document.createElement('div'); c.className='confetti'; c.textContent=emos[i%emos.length];
    c.style.left=(Math.random()*95)+'%';
    c.style.animationDelay=(Math.random()*0.8)+'s';
    stage.appendChild(c);
    setTimeout(()=>c.remove(),3400);
  }
}

function arrive(){
  phase='arrived';
  trainWrap.classList.remove('bob');
  stopTravelFx();
  /* penguin hops off the train and jumps for joy at the station */
  trainWrap.classList.remove('hasRider');
  penguin.style.transition='none';
  penguin.style.left='58%';
  penguin.classList.remove('onboard');
  penguin.style.display='block';
  penguin.classList.add('hop');
  setTimeout(()=>penguin.classList.remove('hop'), 3000);

  addTrainToYard(current);
  const n = yardTrains.length;
  const milestone = (n>0 && n%5===0);
  if(milestone){
    banner.textContent = 'すごい！ でんしゃが '+n+'だい あつまったよ！ 🎊';
    speak('すごい！ でんしゃが '+n+'だい あつまったよ！ はくしゅー！');
    confettiRain();
    fanfare(); setTimeout(fanfare, 600);
  } else {
    banner.textContent = 'とうちゃく！ でんしゃが ふえたよ 🎉';
    speak('とうちゃく！ よくできました。でんしゃが、ふえたよ');
    fanfare();
  }
  const r = stage.getBoundingClientRect();
  sparkleAt(r.width*0.5, r.height*0.4);
  roundIdx++;
  setTimeout(()=>againBtn.classList.add('show'), 900);
}

againBtn.addEventListener('click', ()=>{
  ensureAudio();
  if(phase!=='arrived') return;
  buzz(30);
  againBtn.classList.remove('show');
  startRound();
});

/* ============ yard / collection ============ */
function renderYard(markNew){
  [...yard.querySelectorAll('.yardtrain')].forEach(el=>el.remove());
  const resetBtn = document.getElementById('resetBtn');
  yardTrains.forEach((k,i)=>{
    const t = TRAINS.find(x=>x.key===k) || TRAINS[0];
    const span=document.createElement('span');
    span.className='yardtrain'+(markNew && i===yardTrains.length-1?' new':'');
    span.textContent=t.emoji;
    yard.insertBefore(span, resetBtn);
  });
  yardLabel.textContent = 'でんしゃ '+yardTrains.length+'だい';
  save();
}
function addTrainToYard(t){ yardTrains.push(t.key); renderYard(true); }

function save(){ try{ localStorage.setItem('penguinTrainYard', JSON.stringify(yardTrains)); localStorage.setItem('penguinRoundIdx', roundIdx); }catch(e){} }
function load(){
  try{
    const y = JSON.parse(localStorage.getItem('penguinTrainYard')||'[]'); if(Array.isArray(y)) yardTrains=y;
    const r = parseInt(localStorage.getItem('penguinRoundIdx')||'0',10); if(!isNaN(r)) roundIdx=r;
  }catch(e){}
}
/* reset: two-tap guard so one stray tap can't erase the collection */
const resetBtn = document.getElementById('resetBtn');
let resetArmed=false, resetTimer=null;
resetBtn.addEventListener('click', ()=>{
  if(!resetArmed){
    resetArmed=true;
    resetBtn.classList.add('armed');
    resetBtn.textContent='もういちど タッチで けすよ';
    resetTimer=setTimeout(()=>{ resetArmed=false; resetBtn.classList.remove('armed'); resetBtn.textContent='さいしょから'; }, 3000);
    return;
  }
  clearTimeout(resetTimer); resetArmed=false;
  resetBtn.classList.remove('armed'); resetBtn.textContent='さいしょから';
  yardTrains=[]; roundIdx=0; renderYard(false); startRound();
});

/* sound toggle (preference remembered) */
function applySound(){
  soundBtn.textContent = soundOn ? '🔊 おと' : '🔇 おと';
  if(!soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
}
soundBtn.addEventListener('click', ()=>{
  soundOn=!soundOn;
  try{ localStorage.setItem('penguinSoundOn', soundOn?'1':'0'); }catch(e){}
  applySound();
  if(soundOn) ensureAudio();
});

/* pause speech when the app goes to background; wake audio on return */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
  } else {
    ensureAudio();
  }
});

/* init */
load();
try{ if(localStorage.getItem('penguinSoundOn')==='0') soundOn=false; }catch(e){}
applySound();
renderYard(false);
startRound();
window.addEventListener('resize', ()=>{ if(phase==='board'||phase==='ready') buildScenery(); });
</script>
</body>
</html>
